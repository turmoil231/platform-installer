# .gitlab-ci.yml
#
# CI pipeline for platform-installer.
# Runs on your internal GitLab instance (no external network access from runners).
#
# Pipeline stages:
#   test        → unit + integration tests against the installer Python package
#   build       → compile the single-file binary (PyInstaller) + build the
#                 preloaded Ansible execution image (ansible-core + collections)
#   publish     → push the binary to Artifactory, the image to internal registry
#
# Required GitLab CI/CD variables (set in project Settings → CI/CD → Variables):
#   ARTIFACTORY_URL         https://artifactory.apps.hub.example.internal
#   ARTIFACTORY_USER        admin
#   ARTIFACTORY_PASSWORD    (masked)
#   REGISTRY_URL            registry.example.internal:5000
#   REGISTRY_USER           push-bot
#   REGISTRY_PASSWORD       (masked)
#   GITLAB_TOKEN            (for collection staging from other repos, masked)

default:
  image: registry.example.internal:5000/platform/python-builder:3.11
  before_script:
    - python3 --version
    - pip --version

variables:
  PYTHON_VERSION: "3.11"
  PIP_CACHE_DIR: "${CI_PROJECT_DIR}/packaging/pip-cache"

# Cache pip wheels across jobs on the same branch
cache:
  key: "pip-cache-${CI_COMMIT_REF_SLUG}"
  paths:
    - packaging/pip-cache/

stages:
  - test
  - build
  - publish


# ── Test ──────────────────────────────────────────────────────────────────────

unit-tests:
  stage: test
  script:
    - pip install --quiet -e ".[dev]" --find-links packaging/pip-cache || true
    - pip install --quiet pytest pytest-mock
    - pytest tests/unit/ -v --tb=short --junitxml=reports/junit-unit.xml
  artifacts:
    when: always
    reports:
      junit: reports/junit-unit.xml
    paths:
      - reports/

config-validation:
  stage: test
  script:
    - pip install --quiet -e . --find-links packaging/pip-cache || true
    - platform-installer validate
        --config platform-config.yaml.example
  allow_failure: false

schema-lint:
  stage: test
  script:
    - pip install --quiet pydantic yamllint
    - yamllint ansible/playbooks/
    - yamllint ansible/collections/requirements.yml
    - python3 -c "
        from installer.config.loader import ConfigLoader
        import yaml
        from installer.config.models import PlatformConfig
        print('Schema models OK')
      "


# ── Build ─────────────────────────────────────────────────────────────────────

build-binary:
  stage: build
  needs: [unit-tests, config-validation]
  script:
    # Seed pip cache if not already present (CI cache may be cold)
    - |
      if [[ $(ls packaging/pip-cache/*.whl 2>/dev/null | wc -l) -lt 5 ]]; then
        echo "Seeding pip cache ..."
        ./packaging/seed_pip_cache.sh
      fi

    # Compile the single-file binary (no collections needed for this — they
    # only matter for the Ansible execution image, built separately below)
    - ./packaging/build_binary.sh --skip-tests

    # Smoke test — the binary is directly executable, no extraction/wrapper needed
    - |
      VERSION="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
      "dist/platform-installer-${VERSION}" --help
      echo "Binary smoke test: PASSED"

  artifacts:
    paths:
      - dist/platform-installer-*
    expire_in: 30 days


build-ansible-image:
  stage: build
  needs: [unit-tests]
  image: registry.example.internal:5000/platform/podman-builder:latest
  script:
    - |
      VERSION="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
      IMAGE_TAG="${REGISTRY_URL}/platform/platform-ansible-exec:${VERSION}"
      IMAGE_TAG_LATEST="${REGISTRY_URL}/platform/platform-ansible-exec:latest"

      # Stage collections so they can be baked into the image
      ./scripts/stage_collections.sh \
        --staging-root . \
        --requirements ansible/collections/requirements.yml

      # Build the image
      podman build \
        --file packaging/Containerfile.ansible-exec \
        --tag "${IMAGE_TAG}" \
        --tag "${IMAGE_TAG_LATEST}" \
        --build-arg VERSION="${VERSION}" \
        .

      # Smoke test — no CLI inside this image, verify ansible-core + collections
      podman run --rm "${IMAGE_TAG}" ansible-playbook --version
      podman run --rm "${IMAGE_TAG}" \
        ansible-galaxy collection list --collections-path /opt/ansible/collections
      echo "Ansible execution image smoke test: PASSED"

      # Save as tarball for air-gap transfer artifact
      mkdir -p dist
      podman save "${IMAGE_TAG}" \
        | gzip > "dist/platform-ansible-exec-${VERSION}-container.tar.gz"

  artifacts:
    paths:
      - dist/platform-ansible-exec-*-container.tar.gz
    expire_in: 30 days


# ── Publish ───────────────────────────────────────────────────────────────────

publish-binary-to-artifactory:
  stage: publish
  needs: [build-binary]
  only:
    - tags                                    # Only publish on tagged releases
    - main
  script:
    - |
      VERSION="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
      BINARY="dist/platform-installer-${VERSION}"
      CHECKSUM="dist/platform-installer-${VERSION}.sha256"
      REPO_PATH="${ARTIFACTORY_URL}/artifactory/platform-releases/platform-installer/${VERSION}/"

      echo "Publishing ${BINARY} to Artifactory ..."
      curl --silent --show-error --fail \
        --user "${ARTIFACTORY_USER}:${ARTIFACTORY_PASSWORD}" \
        --upload-file "${BINARY}" \
        "${REPO_PATH}"

      curl --silent --show-error --fail \
        --user "${ARTIFACTORY_USER}:${ARTIFACTORY_PASSWORD}" \
        --upload-file "${CHECKSUM}" \
        "${REPO_PATH}"

      echo "Published: ${REPO_PATH}"


publish-ansible-image-to-registry:
  stage: publish
  needs: [build-ansible-image]
  only:
    - tags
    - main
  image: registry.example.internal:5000/platform/podman-builder:latest
  script:
    - |
      VERSION="$(grep '^version' pyproject.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/')"
      CONTAINER_TAR="dist/platform-ansible-exec-${VERSION}-container.tar.gz"
      IMAGE_TAG="${REGISTRY_URL}/platform/platform-ansible-exec:${VERSION}"
      IMAGE_TAG_LATEST="${REGISTRY_URL}/platform/platform-ansible-exec:latest"

      podman load < "${CONTAINER_TAR}"
      podman login "${REGISTRY_URL}" \
        --username "${REGISTRY_USER}" \
        --password "${REGISTRY_PASSWORD}"
      podman push "${IMAGE_TAG}"
      podman push "${IMAGE_TAG_LATEST}"
      echo "Published: ${IMAGE_TAG}"
